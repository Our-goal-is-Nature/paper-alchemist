schema_version: 1
core_skill: paper-alchemist
operations:
  - distill
  - integrate
  - abstract
  - introduction
  - related-work
  - problem-definition
  - methodology
  - experiment-setup
  - results-analysis
  - conclusion
  - section
agents:
  codex:
    user_skill: ~/.agents/skills/paper-alchemist
    project_skill: .agents/skills/paper-alchemist
    invocation: "$paper-alchemist <operation>"
  claude:
    user_skill: ~/.claude/skills/paper-alchemist
    project_skill: .claude/skills/paper-alchemist
    command_directory: .claude/commands
  opencode:
    user_skill: ~/.agents/skills/paper-alchemist
    project_skill: .agents/skills/paper-alchemist
    command_directory: .opencode/commands
  hermes:
    user_skill: ~/.hermes/skills/paper-alchemist
    project_skill: .agents/skills/paper-alchemist
    project_requirement: add .agents/skills to skills.external_dirs
  pi:
    user_skill: ~/.pi/agent/skills/paper-alchemist
    project_skill: .pi/skills/paper-alchemist
    prompt_directory: .pi/prompts
  kimi:
    user_skill: ~/.kimi-code/skills/paper-alchemist
    project_skill: .kimi-code/skills/paper-alchemist
    wrapper_directory: .kimi-code/skills
    invocation: "/skill:<operation>"
