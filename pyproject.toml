[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-alchemist"
version = "0.3.0"
description = "Cross-agent bilingual academic writing style distillation toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "misakimei0331" }]
keywords = ["agent-skills", "academic-writing", "paper", "bilingual", "distillation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "pypdf>=5.0,<7",
  "python-docx>=1.1,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
paper-alchemist = "paper_alchemist.cli:main"

[project.urls]
Homepage = "https://github.com/Wang-Ruibin/paper-alchemist"
Repository = "https://github.com/Wang-Ruibin/paper-alchemist"
Issues = "https://github.com/Wang-Ruibin/paper-alchemist/issues"

[tool.setuptools]
packages = ["paper_alchemist"]
package-dir = { paper_alchemist = "engine" }

[tool.setuptools.data-files]
"share/paper-alchemist/skills/paper-alchemist" = ["paper-alchemist/SKILL.md"]
"share/paper-alchemist/skills/paper-alchemist/agents" = ["paper-alchemist/agents/openai.yaml"]
"share/paper-alchemist/skills/paper-alchemist/assets" = ["paper-alchemist/assets/paper-context.example.yaml"]
"share/paper-alchemist/skills/paper-alchemist/references" = [
  "paper-alchemist/references/generation.md",
  "paper-alchemist/references/platforms.md",
  "paper-alchemist/references/schemas.md",
  "paper-alchemist/references/workflow.md",
]
"share/paper-alchemist/skills/paper-alchemist/scripts" = ["paper-alchemist/scripts/run.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
