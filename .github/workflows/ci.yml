name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: paper-alchemist install --agent codex --scope project --project-root "$RUNNER_TEMP/install-codex" --dry-run
      - run: paper-alchemist package-skill --output dist
      - if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: paper-alchemist-skill
          path: dist/paper-alchemist.skill
