name: Feature request
description: Propose a focused capability or compatibility improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful outcome, including the target Agent or paper module.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Evidence and privacy boundaries
      description: Explain how the feature avoids invented facts, source copying, and private-data publication.
    validations:
      required: true
