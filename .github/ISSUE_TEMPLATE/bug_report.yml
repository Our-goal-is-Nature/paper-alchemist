name: Bug report
description: Report a reproducible Paper Alchemist defect using synthetic data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach copyrighted papers, private contexts, extracted caches, credentials, or unpublished results.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options: [Codex, Claude Code, OpenCode, Hermes, Pi Agent, Kimi Code, CLI only, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide commands and minimal original input that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed papers, private contexts, caches, credentials, local paths, and unpublished research.
          required: true
